# Daily arXiv Agent Configuration

# 应用配置 / App settings
app:
  # 部署语言 / Deployment language: zh 或 en
  language: "zh"

# 跟踪主题配置 / Research tracking settings
tracking_topics:
  - "virtual power plant"
  - "reinforcement learning"
  - "game theory"
  - "embodied intelligence for energy systems"
  - "energy systems"

# 仅凭带版本、学科、ISSN 和出处的中科院大类分区证据准入。
paper_quality:
  enabled: true
  classification_system: cas
  category_level: major
  venue_evidence_path: data/private/cas_venues.json
  approved_venues: []
  excluded_venues:
    - name: IEEE Communications Surveys and Tutorials
      issn_l: 1553-877X
      evidence_url: https://www.comsoc.org/publications/journals/ieee-communications-surveys-tutorials
  pending_venues:
  - id: ieee_tsg
    name: IEEE Transactions on Smart Grid
    issn_l: 1949-3053
    publisher: IEEE
  - id: ieee_tps
    name: IEEE Transactions on Power Systems
    issn_l: 0885-8950
    publisher: IEEE
  - id: ieee_tse
    name: IEEE Transactions on Sustainable Energy
    issn_l: 1949-3029
    publisher: IEEE
  - id: ieee_tii
    name: IEEE Transactions on Industrial Informatics
    issn_l: 1551-3203
    publisher: IEEE
  - id: ieee_iotj
    name: IEEE Internet of Things Journal
    issn_l: 2327-4662
    publisher: IEEE
  - id: applied_energy
    name: Applied Energy
    issn_l: 0306-2619
    publisher: Elsevier
  - id: energy
    name: Energy
    issn_l: 0360-5442
    publisher: Elsevier
  - id: energy_conversion_management
    name: Energy Conversion and Management
    issn_l: 0196-8904
    publisher: Elsevier
  - id: renewable_sustainable_reviews
    name: Renewable and Sustainable Energy Reviews
    issn_l: 1364-0321
    publisher: Elsevier
  - id: renewable_energy
    name: Renewable Energy
    issn_l: 0960-1481
    publisher: Elsevier
  - id: international_jepes
    name: International Journal of Electrical Power and Energy Systems
    aliases:
    - International Journal of Electrical Power & Energy Systems
    issn_l: 0142-0615
    publisher: Elsevier
  - id: nature_energy
    name: Nature Energy
    issn_l: 2058-7546
    publisher: Nature Portfolio
  - id: joule
    name: Joule
    issn_l: 2542-4351
    publisher: Cell Press
paper_discovery:
  enabled: true
  library_directory: data/library
  checkpoint_directory: data/state/paper_discovery
  raw_directory: data/raw/academic
  journal_issns: ["1551-3203", "2327-4662", "0018-9286", "2162-237X", "2168-2267", "2168-2216", "0957-4174", "0952-1976", "0019-0578", "1568-4946", "0893-6080", "0950-7051", "2329-9266"]
  history_requests_per_run: 120
  history_years: 10
  max_pages_per_run: 40
  require_topic_match: true
  search_terms:
  - energy reinforcement learning
  - microgrid multi-agent
  - power system autonomous control
  - electricity market game theory
  - virtual power plant optimization
  - demand response mechanism design
  - energy digital twin control
  - battery reinforcement learning
  - energy system multi-agent coordination
  - power grid distributed control
  - electricity market bidding
  - renewable energy autonomous control
  enrichment:
    enabled: true
    max_records_per_run: 100
  citations:
    reference_depth: 2
    citing_depth: 1
    max_requests_per_run: 100

# 研究边界：聚焦能源系统中的具身智能，不跟踪通用机器人与机械臂方向。
research_profile:
  topic: "能源系统中的具身智能与自主决策"
  focus:
    - "能源智能体对物理能源设备的感知、决策与控制"
    - "源网荷储交互中的强化学习与多智能体协同"
    - "虚拟电厂、电力市场和能源设备的自主运行"
  technical_routes:
    - "多智能体强化学习与协同控制"
    - "博弈论、机制设计与电力市场决策"
    - "数字孪生驱动的能源设备感知与自主运行"
  excluded_directions:
    - "通用机器人操控"
    - "机械臂"
    - "机器人导航"
    - "人形机器人"
  comparison:
    strength_threshold: 60
    gap_threshold: 30
    follow_up_per_type: 3

# 默认聚焦中国国内政策、行业与科研信息。
regional_focus:
  - "CN"

# 统一文档摘要配置（论文、政策、新闻和行业报告）
summarization:
  max_new_paper_summaries: 50
  max_input_chars: 12000
  max_tokens: 1400

# 本地显式标签层；不依赖 LLM，可直接为网页筛选控件提供数据。
tag_extraction:
  enabled: true
  include_configured_topics: true
  max_tags: 20
  max_entities: 30

# 多源可解释排序；分数和建议动作将直接显示在网页卡片中。
ranking:
  enabled: true
  weights:
    topic_relevance: 0.40
    novelty: 0.15
    policy_importance: 0.20
    industry_relevance: 0.15
    source_credibility: 0.10
  thresholds:
    high: 70
    medium: 45

# 跨来源去重与关联；关联结果直接进入网页卡片。
linking:
  enabled: true
  title_similarity_threshold: 0.92
  relation_threshold: 0.35
  max_related_per_document: 8

# 研究主题关键词组（用于标签、摘要、分析，不直接等同于抓取查询）
# Research keyword groups for analysis and classification, separate from fetch queries.
keyword_groups:
  - name: "energy_systems"
    terms:
      - "virtual power plant"
      - "distributed energy resources"
      - "energy management"
      - "electricity market"
      - "demand response"
      - "microgrid"
      - "power system"
  - name: "learning_and_control"
    terms:
      - "reinforcement learning"
      - "deep reinforcement learning"
      - "multi-agent reinforcement learning"
      - "Markov decision process"
      - "control"
  - name: "markets_and_coordination"
    terms:
      - "game theory"
      - "Stackelberg"
      - "Nash"
      - "auction"
      - "bidding"
      - "market mechanism"
  - name: "energy_embodied_intelligence"
    terms:
      - "能源具身智能"
      - "能源智能体"
      - "embodied intelligence for energy systems"
      - "autonomous energy agent"
      - "physical energy equipment"
      - "源网荷储"

# 负向关键词 / Negative keywords
negative_keywords:
  - "robot"
  - "robotics"
  - "robot arm"
  - "manipulator"
  - "humanoid"
  - "机器人"
  - "机械臂"
  - "人形机器人"

# 优先级规则 / Priority rules
priority_rules:
  - name: "core_research_match"
    description: "Boost documents that mention both energy systems and learning/control topics."
  - name: "recent_policy_signal"
    description: "Boost recent policy documents that directly mention tracked topics."

# 多源采集配置 / Multi-source collection settings
sources:
  arxiv:
    enabled: true
    # 研究领域类别（可以是多个）/ Research categories (multiple allowed)
    categories:
      - "eess.SY"
      - "cs.LG"
      - "cs.MA"
      - "cs.GT"
      - "cs.AI"
    # 抓取查询关键词组：组内 OR，组间 AND / Fetch query groups: OR within groups, AND across groups
    keyword_groups:
      - name: "virtual_power_plant_and_energy_system"
        terms:
          - "virtual power plant"
          - "virtual power plants"
          - "VPP"
          - "distributed energy resource"
          - "distributed energy resources"
          - "energy management"
          - "electricity market"
          - "demand response"
          - "microgrid"
          - "power system"
      - name: "learning_control_and_market"
        terms:
          - "reinforcement learning"
          - "deep reinforcement learning"
          - "multi-agent reinforcement learning"
          - "MARL"
          - "Markov decision process"
          - "MDP"
          - "autonomous control"
          - "digital twin"
          - "game theory"
          - "game-theoretic"
          - "Stackelberg"
          - "Nash"
          - "auction"
          - "bidding"
          - "market mechanism"
    keywords: []
    max_results: 20
    days_back: 180
    fallback_days_back: 365
    sort_by: "relevance"
    sort_order: "descending"
    ranking:
      enabled: true
      primary: "citation_count"
      secondary: "openalex_referenced_works_count"

  openalex:
    enabled: true
    api_key: ""
    email: ""
    per_page: 25
    request_timeout_seconds: 20
    max_title_search_results: 5
    cache_path: "data/cache/openalex_works.json"
    select_fields:
      - "id"
      - "doi"
      - "title"
      - "display_name"
      - "publication_year"
      - "publication_date"
      - "cited_by_count"
      - "primary_topic"
      - "topics"
      - "authorships"
      - "referenced_works"
      - "referenced_works_count"
      - "ids"
      - "updated_date"
      - "type"
      - "primary_location"

  openalex_search:
    enabled: true
    per_page: 100
    max_pages_per_run: 40
    recent_days: 180
    request_timeout_seconds: 30
  crossref:
    enabled: true
    per_page: 100
    max_pages_per_run: 40
    recent_days: 180
    request_timeout_seconds: 30
    mailto: ''
  openaire:
    enabled: true
    per_page: 100
    max_pages_per_run: 40
