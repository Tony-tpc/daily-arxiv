verification:
  evidence_links:
    # 在分析产物生成后离线核验引用链接；页面仅读取缓存，不在访问时请求外部站点。
    enabled: true
    analysis_path: "data/analysis/latest.json"
    cache_path: "data/cache/evidence_link_audit.json"
    request_timeout_seconds: 15
    max_workers: 6

# LLM 配置 / LLM settings
llm:
  # 提供商 / Provider: openai, gemini, claude, deepseek, vllm
  provider: "deepseek"
  
  # OpenAI 配置 / OpenAI settings
  openai:
    api_key: ""  # 在 .env 文件中设置 / Set in .env file
    model: "gpt-4o-mini"  # gpt-4, gpt-4o, gpt-3.5-turbo
    base_url: ""  # 可选，用于代理或自定义端点 / Optional for proxy or custom endpoint
    temperature: 0.2
    max_tokens: 8192

  # Google Gemini 配置 / Google Gemini settings
  gemini:
    api_key: ""  # 在 .env 文件中设置 / Set in .env file
    model: "gemini-1.5-flash"  # gemini-pro, gemini-1.5-flash, gemini-1.5-pro
    temperature: 0.2
    max_tokens: 8192
  
  # Anthropic Claude 配置 / Anthropic Claude settings
  claude:
    api_key: ""  # 在 .env 文件中设置 / Set in .env file
    model: "claude-3-5-sonnet-20241022"  # claude-3-opus, claude-3-sonnet, claude-3-haiku
    temperature: 0.2
    max_tokens: 8192
  
  # DeepSeek 配置 / DeepSeek settings
  deepseek:
    api_key: ""  # 在 .env 文件中设置 / Set in .env file
    model: "deepseek-chat"  # deepseek-chat, deepseek-coder
    base_url: "https://api.deepseek.com/v1"
    temperature: 0.2
    max_tokens: 8192
  
  # vLLM（OpenAI 兼容 API）/ vLLM (OpenAI-compatible API)
  vllm:
    api_key: "EMPTY"  # vLLM 通常不需要 API Key / vLLM usually does not require a real API key
    model: "gpt-oss-120b"  # 你部署的模型名称 example: gpt-oss-120b
    base_url: "http://172.24.128.111:30207/v1"  # vLLM 服务地址 example: http://172.24.128.111:30207/v1
    temperature: 0.2
    max_tokens: 8192

# 自适应知识抽取 / Adaptive knowledge extraction
knowledge_extraction:
  enabled: true
  # 通用字段固定，seed facets 只作为初始提示；系统会根据主题和论文自动生成最终 facets。
  # Generic fields are fixed; seed facets only guide topic-adaptive schema induction.
  seed_facets:
    - "method"
    - "scenario"
    - "mechanism"
    - "constraint"
    - "metric"
  allow_new_facets: true
  require_evidence: true
  max_papers: 20
  new_facet_min_support: 2

# Web 服务配置 / Web service settings
web:
  host: "0.0.0.0"
  port: 5000
  debug: false
  title: "能源研究资料平台"
  # Web 描述 / Web description
  description: "中国能源政策、能源系统智能控制与源网荷储协调研究资料"

# 调度配置 / Scheduler settings
scheduler:
  # 是否启用自动调度 / Enable automatic scheduling
  enabled: true
  
  # 时区 / Timezone
  timezone: "Asia/Shanghai"
  
  # 启动时默认只注册任务，避免服务重启触发四类来源同时抓取。
  run_on_start: false

  # 失败重试采用有上限的指数退避。
  retry:
    max_attempts: 3
    base_delay_seconds: 30
    max_delay_seconds: 300

  status_path: "data/state/scheduler_status.json"
  task_log_path: "logs/scheduler_jobs.jsonl"

  # 学术、国内新闻、中国政策、国内行业报告独立调度。
  jobs:
    academic_weekly:
      enabled: true
      name: "学术论文每周采集"
      sources:
        - "arxiv"
        - "openalex_search"
        - "crossref"
        - "openaire"
        - "semantic_scholar"
      day_of_week: "sun"
      trigger: "cron"
      hour: 9
      minute: 0
    news_8h:
      enabled: true
      name: "国内能源新闻每八小时采集"
      sources:
        - "rss"
      trigger: "interval"
      hours: 8
    policy_daily:
      enabled: true
      name: "中国能源政策每日采集"
      sources:
        - "policy"
      trigger: "cron"
      hour: 10
      minute: 0
    industry_weekly:
      enabled: true
      name: "国内能源行业报告每周采集"
      sources:
        - "industry_report"
      trigger: "cron"
      day_of_week: "mon"
      hour: 11
      minute: 0
  
  # 邮件通知配置（可选）/ Email notification settings (optional)
  notification:
    enabled: false
    email:
      smtp_server: "smtp.gmail.com"
      smtp_port: 587
      sender: ""  # 发件人邮箱 / Sender email
      password: ""  # 在 .env 文件中设置 EMAIL_PASSWORD / Set EMAIL_PASSWORD in .env
      recipients:  # 收件人列表 / Recipient list
        - "your-email@example.com"
      on_success: true  # 成功时发送通知 / Notify on success
      on_failure: true  # 失败时发送通知 / Notify on failure

# 数据存储配置 / Data storage settings
storage:
  # 存储类型 / Storage type: json 或 sqlite
  type: "json"
  
  # JSON 存储路径 / JSON storage path
  json_path: "data/papers"

  # 统一文档 snapshot 存储路径 / Canonical document snapshots
  document_json_path: "data/documents"
  
  # SQLite 数据库路径 / SQLite database path
  sqlite_path: "data/arxiv.db"
  
  # 保留历史数据的天数（0 表示永久保留）/ Retention days (0 means keep forever)
  retention_days: 30

# 输出配置 / Output settings
outputs:
  markdown:
    enabled: true
    directory: "data/markdown"
  json:
    enabled: true
    directory: "data"
  obsidian:
    enabled: false
    vault_path: "data/obsidian"
    use_markdown_links: true
  zotero:
    enabled: false
    mode: "local_api"
    base_url: "http://localhost:23119/api"
    user_id: 0
    timeout_seconds: 5
    export_directory: "data/zotero"

# 分析配置 / Analysis settings
analysis:
  # 可覆盖自动发现的微软雅黑/Noto CJK 等字体；默认留空以保持跨平台。
  wordcloud_font_path: ""
  history_directory: "data/history"
  narrative:
    min_chars: 4000
    max_chars: 6000
    max_paper_evidence: 36
    max_source_evidence: 24
    min_source_documents: 12
    min_source_months: 6
  forecast:
    history_months: 24
    min_quant_months: 12
    min_nonzero_months: 6
    min_topic_documents: 12
    strategic_min_months: 18
    strategic_min_documents: 24
    random_state: 42
  trend_window_days:
    - 7
    - 30
    - 60
  compare_sources: true
  entity_tracking: true
  cross_source:
    strong_threshold: 60
    resonance_threshold: 55
    weak_threshold: 40
    max_representatives: 3

reporting:
  enabled: true
  default_type: "weekly"
  directory: "data/reports"
  max_items_per_section: 6
  weekly_days: 7
  stage_days: 180

# 日志配置 / Logging settings
logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR, CRITICAL
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "logs/daily_arxiv.log"
  console: true

# AIHOT-inspired energy editorial pipeline; thresholds need domain calibration.
hotspots:
  enabled: true
  state_path: data/hotspots/state.sqlite3
  max_documents_per_run: 50
  max_calls_per_run: 300
  thresholds:
    T1: 60
    T1_5: 65
    T2: 76
