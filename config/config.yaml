# Daily arXiv Agent Configuration

# 应用配置 / App settings
app:
  # 部署语言 / Deployment language: zh 或 en
  language: "zh"

# 跟踪主题配置 / Research tracking settings
tracking_topics:
  - "virtual power plant"
  - "reinforcement learning"
  - "game theory"
  - "embodied intelligence for energy systems"
  - "energy systems"

# 论文准入白名单：只让已登记的 Q1/Q2 正式期刊论文进入后续排序、报告和趋势分析。
# 不以出版社名称或引用量替代分区；名单应每年依据本单位可访问的 JCR/中科院分区复核。
paper_quality:
  enabled: true
  require_formal_journal_article: true
  accepted_publication_types: ["article", "journal-article"]
  maximum_allowed_quartile: "Q2"
  approved_venues:
    - id: ieee_tsg
      name: "IEEE Transactions on Smart Grid"
      issn_l: "1949-3053"
      publisher: "IEEE"
      quartile: "Q1"
    - id: ieee_tps
      name: "IEEE Transactions on Power Systems"
      issn_l: "0885-8950"
      publisher: "IEEE"
      quartile: "Q1"
    - id: ieee_tse
      name: "IEEE Transactions on Sustainable Energy"
      issn_l: "1949-3029"
      publisher: "IEEE"
      quartile: "Q1"
    - id: ieee_tii
      name: "IEEE Transactions on Industrial Informatics"
      issn_l: "1551-3203"
      publisher: "IEEE"
      quartile: "Q1"
    - id: ieee_iotj
      name: "IEEE Internet of Things Journal"
      issn_l: "2327-4662"
      publisher: "IEEE"
      quartile: "Q1"
    - id: applied_energy
      name: "Applied Energy"
      issn_l: "0306-2619"
      publisher: "Elsevier"
      quartile: "Q1"
    - id: energy
      name: "Energy"
      issn_l: "0360-5442"
      publisher: "Elsevier"
      quartile: "Q1"
    - id: energy_conversion_management
      name: "Energy Conversion and Management"
      issn_l: "0196-8904"
      publisher: "Elsevier"
      quartile: "Q1"
    - id: renewable_sustainable_reviews
      name: "Renewable and Sustainable Energy Reviews"
      issn_l: "1364-0321"
      publisher: "Elsevier"
      quartile: "Q1"
    - id: renewable_energy
      name: "Renewable Energy"
      issn_l: "0960-1481"
      publisher: "Elsevier"
      quartile: "Q1"
    - id: international_jepes
      name: "International Journal of Electrical Power and Energy Systems"
      aliases: ["International Journal of Electrical Power & Energy Systems"]
      issn_l: "0142-0615"
      publisher: "Elsevier"
      quartile: "Q1"
    - id: nature_energy
      name: "Nature Energy"
      issn_l: "2058-7546"
      publisher: "Nature Portfolio"
      quartile: "Q1"
    - id: joule
      name: "Joule"
      issn_l: "2542-4351"
      publisher: "Cell Press"
      quartile: "Q1"

# 研究边界：聚焦能源系统中的具身智能，不跟踪通用机器人与机械臂方向。
research_profile:
  topic: "能源系统中的具身智能与自主决策"
  focus:
    - "能源智能体对物理能源设备的感知、决策与控制"
    - "源网荷储交互中的强化学习与多智能体协同"
    - "虚拟电厂、电力市场和能源设备的自主运行"
  technical_routes:
    - "多智能体强化学习与协同控制"
    - "博弈论、机制设计与电力市场决策"
    - "数字孪生驱动的能源设备感知与自主运行"
  excluded_directions:
    - "通用机器人操控"
    - "机械臂"
    - "机器人导航"
    - "人形机器人"
  comparison:
    strength_threshold: 60
    gap_threshold: 30
    follow_up_per_type: 3

# 默认聚焦中国国内政策、行业与科研信息。
regional_focus:
  - "CN"

# 统一文档摘要配置（论文、政策、新闻和行业报告）
summarization:
  max_input_chars: 12000
  max_tokens: 1400

# 本地显式标签层；不依赖 LLM，可直接为网页筛选控件提供数据。
tag_extraction:
  enabled: true
  include_configured_topics: true
  max_tags: 20
  max_entities: 30

# 多源可解释排序；分数和建议动作将直接显示在网页卡片中。
ranking:
  enabled: true
  weights:
    topic_relevance: 0.40
    novelty: 0.15
    policy_importance: 0.20
    industry_relevance: 0.15
    source_credibility: 0.10
  thresholds:
    high: 70
    medium: 45

# 跨来源去重与关联；关联结果直接进入网页卡片。
linking:
  enabled: true
  title_similarity_threshold: 0.92
  relation_threshold: 0.35
  max_related_per_document: 8

# 研究主题关键词组（用于标签、摘要、分析，不直接等同于抓取查询）
# Research keyword groups for analysis and classification, separate from fetch queries.
keyword_groups:
  - name: "energy_systems"
    terms:
      - "virtual power plant"
      - "distributed energy resources"
      - "energy management"
      - "electricity market"
      - "demand response"
      - "microgrid"
      - "power system"
  - name: "learning_and_control"
    terms:
      - "reinforcement learning"
      - "deep reinforcement learning"
      - "multi-agent reinforcement learning"
      - "Markov decision process"
      - "control"
  - name: "markets_and_coordination"
    terms:
      - "game theory"
      - "Stackelberg"
      - "Nash"
      - "auction"
      - "bidding"
      - "market mechanism"
  - name: "energy_embodied_intelligence"
    terms:
      - "能源具身智能"
      - "能源智能体"
      - "embodied intelligence for energy systems"
      - "autonomous energy agent"
      - "physical energy equipment"
      - "源网荷储"

# 负向关键词 / Negative keywords
negative_keywords:
  - "robot"
  - "robotics"
  - "robot arm"
  - "manipulator"
  - "humanoid"
  - "机器人"
  - "机械臂"
  - "人形机器人"

# 优先级规则 / Priority rules
priority_rules:
  - name: "core_research_match"
    description: "Boost documents that mention both energy systems and learning/control topics."
  - name: "recent_policy_signal"
    description: "Boost recent policy documents that directly mention tracked topics."

# 多源采集配置 / Multi-source collection settings
sources:
  arxiv:
    enabled: true
    # 研究领域类别（可以是多个）/ Research categories (multiple allowed)
    categories:
      - "eess.SY"
      - "cs.LG"
      - "cs.MA"
      - "cs.GT"
      - "cs.AI"
    # 抓取查询关键词组：组内 OR，组间 AND / Fetch query groups: OR within groups, AND across groups
    keyword_groups:
      - name: "virtual_power_plant_and_energy_system"
        terms:
          - "virtual power plant"
          - "virtual power plants"
          - "VPP"
          - "distributed energy resource"
          - "distributed energy resources"
          - "energy management"
          - "electricity market"
          - "demand response"
          - "microgrid"
          - "power system"
      - name: "reinforcement_learning"
        terms:
          - "reinforcement learning"
          - "deep reinforcement learning"
          - "multi-agent reinforcement learning"
          - "MARL"
          - "Markov decision process"
          - "MDP"
      - name: "game_and_market_mechanism"
        terms:
          - "game theory"
          - "game-theoretic"
          - "Stackelberg"
          - "Nash"
          - "auction"
          - "bidding"
          - "market mechanism"
    keywords: []
    max_results: 20
    days_back: 30
    fallback_days_back: 365
    sort_by: "relevance"
    sort_order: "descending"
    ranking:
      enabled: true
      primary: "citation_count"
      secondary: "openalex_referenced_works_count"

  openalex:
    enabled: true
    api_key: ""
    email: ""
    per_page: 25
    request_timeout_seconds: 20
    max_title_search_results: 5
    cache_path: "data/cache/openalex_works.json"
    select_fields:
      - "id"
      - "doi"
      - "title"
      - "display_name"
      - "publication_year"
      - "publication_date"
      - "cited_by_count"
      - "primary_topic"
      - "topics"
      - "authorships"
      - "referenced_works"
      - "referenced_works_count"
      - "ids"
      - "updated_date"
      - "type"
      - "primary_location"

  openalex_search:
    enabled: true
    request_timeout_seconds: 20
    # 白名单会在规范化阶段排除非正式期刊和未登记期刊，扩大候选池以避免结果过少。
    per_page: 100
    max_results: 100
    recent_days: 180
    sort: "publication_date:desc"
    # 每一条为独立检索式，优先覆盖能源设备自主决策、源网荷储与电力市场。
    search_terms:
      - "virtual power plant reinforcement learning"
      - "multi-agent reinforcement learning power system"
      - "energy system digital twin autonomous control"
      - "electricity market multi-agent"
    # OpenAlex 限流时仅补充 Crossref 的正式期刊元数据，仍执行同一份 Q1/Q2 白名单。
    crossref_fallback:
      enabled: true
      rows_per_query: 50
      from_publication_date: "2024-01-01"
      mailto: ""
    backfill_max_results_per_month: 500
    backfill_concept_id: "C89227174"
    topic_query: '"energy agent" OR "autonomous energy system" OR "multi-agent reinforcement learning power system" OR "virtual power plant autonomous control" OR "source grid load storage" OR "digital twin energy system" OR "electricity market multi-agent"'

  rss:
    enabled: true
    # 排除企业上市、融资、业绩、产品发布等公司动态，保留系统级国内能源新闻。
    exclude_enterprise_updates: true
    enterprise_entity_keywords:
