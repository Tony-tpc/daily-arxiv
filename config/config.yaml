# Daily arXiv Agent Configuration

# 应用配置 / App settings
app:
  # 部署语言 / Deployment language: zh 或 en
  language: "zh"

# 跟踪主题配置 / Research tracking settings
tracking_topics:
  - "virtual power plant"
  - "reinforcement learning"
  - "game theory"
  - "embodied intelligence for energy systems"
  - "energy systems"

# 研究边界：聚焦能源系统中的具身智能，不跟踪通用机器人与机械臂方向。
research_profile:
  topic: "能源系统中的具身智能与自主决策"
  focus:
    - "能源智能体对物理能源设备的感知、决策与控制"
    - "源网荷储交互中的强化学习与多智能体协同"
    - "虚拟电厂、电力市场和能源设备的自主运行"
  excluded_directions:
    - "通用机器人操控"
    - "机械臂"
    - "机器人导航"
    - "人形机器人"

# 默认聚焦中国国内政策、行业与科研信息。
regional_focus:
  - "CN"

# 统一文档摘要配置（论文、政策、新闻和行业报告）
summarization:
  max_input_chars: 12000
  max_tokens: 1400

# 本地显式标签层；不依赖 LLM，可直接为网页筛选控件提供数据。
tag_extraction:
  enabled: true
  include_configured_topics: true
  max_tags: 20
  max_entities: 30

# 多源可解释排序；分数和建议动作将直接显示在网页卡片中。
ranking:
  enabled: true
  weights:
    topic_relevance: 0.40
    novelty: 0.15
    policy_importance: 0.20
    industry_relevance: 0.15
    source_credibility: 0.10
  thresholds:
    high: 70
    medium: 45

# 跨来源去重与关联；关联结果直接进入网页卡片。
linking:
  enabled: true
  title_similarity_threshold: 0.92
  relation_threshold: 0.35
  max_related_per_document: 8

# 研究主题关键词组（用于标签、摘要、分析，不直接等同于抓取查询）
# Research keyword groups for analysis and classification, separate from fetch queries.
keyword_groups:
  - name: "energy_systems"
    terms:
      - "virtual power plant"
      - "distributed energy resources"
      - "energy management"
      - "electricity market"
      - "demand response"
      - "microgrid"
      - "power system"
  - name: "learning_and_control"
    terms:
      - "reinforcement learning"
      - "deep reinforcement learning"
      - "multi-agent reinforcement learning"
      - "Markov decision process"
      - "control"
  - name: "markets_and_coordination"
    terms:
      - "game theory"
      - "Stackelberg"
      - "Nash"
      - "auction"
      - "bidding"
      - "market mechanism"
  - name: "energy_embodied_intelligence"
    terms:
      - "能源具身智能"
      - "能源智能体"
      - "embodied intelligence for energy systems"
      - "autonomous energy agent"
      - "physical energy equipment"
      - "源网荷储"

# 负向关键词 / Negative keywords
negative_keywords: []

# 优先级规则 / Priority rules
priority_rules:
  - name: "core_research_match"
    description: "Boost documents that mention both energy systems and learning/control topics."
  - name: "recent_policy_signal"
    description: "Boost recent policy documents that directly mention tracked topics."

# 多源采集配置 / Multi-source collection settings
sources:
  arxiv:
    enabled: false
    # 研究领域类别（可以是多个）/ Research categories (multiple allowed)
    categories:
      - "eess.SY"
      - "cs.LG"
      - "cs.MA"
      - "cs.GT"
      - "cs.AI"
    # 抓取查询关键词组：组内 OR，组间 AND / Fetch query groups: OR within groups, AND across groups
    keyword_groups:
      - name: "virtual_power_plant_and_energy_system"
        terms:
          - "virtual power plant"
          - "virtual power plants"
          - "VPP"
          - "distributed energy resource"
          - "distributed energy resources"
          - "energy management"
          - "electricity market"
          - "demand response"
          - "microgrid"
          - "power system"
      - name: "reinforcement_learning"
        terms:
          - "reinforcement learning"
          - "deep reinforcement learning"
          - "multi-agent reinforcement learning"
          - "MARL"
          - "Markov decision process"
          - "MDP"
      - name: "game_and_market_mechanism"
        terms:
          - "game theory"
          - "game-theoretic"
          - "Stackelberg"
          - "Nash"
          - "auction"
          - "bidding"
          - "market mechanism"
    keywords: []
    max_results: 20
    days_back: 30
    fallback_days_back: 365
    sort_by: "relevance"
    sort_order: "descending"
    ranking:
      enabled: true
      primary: "citation_count"
      secondary: "openalex_referenced_works_count"

  openalex:
    enabled: true
    api_key: ""
    email: ""
    per_page: 25
    request_timeout_seconds: 20
    max_title_search_results: 5
    cache_path: "data/cache/openalex_works.json"
    select_fields:
      - "id"
      - "doi"
      - "title"
      - "display_name"
      - "publication_year"
      - "cited_by_count"
      - "primary_topic"
      - "topics"
      - "authorships"
      - "referenced_works"
      - "referenced_works_count"
      - "ids"
      - "updated_date"

  openalex_search:
    enabled: true
    request_timeout_seconds: 20
    per_page: 25
    max_results: 20
    recent_days: 180
    sort: "publication_date:desc"
    topic_query: '"peer-to-peer energy trading" OR "P2P energy trading" OR "peer-to-peer electricity market" OR "peer-to-peer electricity trading" OR "peer-to-peer energy market" OR "P2P electricity market"'

  rss:
    enabled: false
    # 国内试点来源；顶层 RSS 开关启用前不会发起请求。
    feeds:
      - name: "人民网 IT"
        url: "https://www.people.com.cn/rss/it.xml"
        source_category: "technology_media"
        region: "CN"
      - name: "人民网财经"
        url: "https://www.people.com.cn/rss/finance.xml"
        source_category: "news_media"
        region: "CN"
      - name: "中国新闻网财经"
        url: "https://www.chinanews.com.cn/rss/finance.xml"
        source_category: "news_media"
        region: "CN"
      - name: "经济观察网产业"
        url: "https://www.eeo.com.cn/industry/rss.xml"
        source_category: "industry_media"
        region: "CN"
      - name: "中国新闻网时政"
        url: "https://www.chinanews.com.cn/rss/china.xml"
        source_category: "policy_news"
        region: "CN"
    request_timeout_seconds: 20
    deduplication: "url_and_title_hash"
    state_path: "data/state/rss.json"
    snapshot_dir: "data/raw/rss"
    max_entries_per_feed: 100
    max_seen_items: 10000

  policy:
    enabled: false
    feeds:
      - name: "国家能源局"
        url: "https://www.nea.gov.cn/"
        format: "html"
        item_selector: ".index_list02 li"
        link_selector: "a[href]"
        date_selector: "span"
        detail_content_selector: ".article-content"
        fetch_detail: true
        issuing_body: "国家能源局"
        policy_level: "national"
        region: "CN"
        max_entries: 40
      - name: "国家发展改革委通知"
        url: "https://www.ndrc.gov.cn/xxgk/zcfb/tz/"
        format: "html"
        item_selector: ".list > ul > li"
        link_selector: "a[href]"
        date_selector: "span"
        detail_content_selector: ".article_con"
        fetch_detail: true
        issuing_body: "国家发展和改革委员会"
        document_type: "notice"
        policy_strength: "medium"
        policy_level: "national"
        region: "CN"
        max_entries: 30
      - name: "国家发展改革委规范性文件"
        url: "https://www.ndrc.gov.cn/xxgk/zcfb/ghxwj/"
        format: "html"
        item_selector: ".list > ul > li"
        link_selector: "a[href]"
        date_selector: "span"
        detail_content_selector: ".article_con"
        fetch_detail: true
        issuing_body: "国家发展和改革委员会"
        document_type: "regulation"
        policy_strength: "high"
        policy_level: "national"
        region: "CN"
        max_entries: 30
    regions:
      - "CN"
    request_timeout_seconds: 20
    state_path: "data/state/policy.json"
    snapshot_dir: "data/raw/policy"
    max_entries_per_feed: 100
    max_seen_items: 10000
    llm_extraction:
      enabled: true
      max_tokens: 900

  industry_report:
    enabled: false
    feeds: []
    regions:
      - "CN"
    request_timeout_seconds: 20
    state_path: "data/state/industry_report.json"
    snapshot_dir: "data/raw/industry_report"
    max_entries_per_feed: 100
    max_seen_items: 10000
    llm_extraction:
      enabled: true
      max_tokens: 900

# LLM 配置 / LLM settings
llm:
  # 提供商 / Provider: openai, gemini, claude, deepseek, vllm
  provider: "deepseek"
  
  # OpenAI 配置 / OpenAI settings
  openai:
    api_key: ""  # 在 .env 文件中设置 / Set in .env file
    model: "gpt-4o-mini"  # gpt-4, gpt-4o, gpt-3.5-turbo
    base_url: ""  # 可选，用于代理或自定义端点 / Optional for proxy or custom endpoint
    temperature: 0.2
    max_tokens: 8192

  # Google Gemini 配置 / Google Gemini settings
  gemini:
    api_key: ""  # 在 .env 文件中设置 / Set in .env file
    model: "gemini-1.5-flash"  # gemini-pro, gemini-1.5-flash, gemini-1.5-pro
    temperature: 0.2
    max_tokens: 8192
  
  # Anthropic Claude 配置 / Anthropic Claude settings
  claude:
    api_key: ""  # 在 .env 文件中设置 / Set in .env file
    model: "claude-3-5-sonnet-20241022"  # claude-3-opus, claude-3-sonnet, claude-3-haiku
    temperature: 0.2
    max_tokens: 8192
  
  # DeepSeek 配置 / DeepSeek settings
  deepseek:
    api_key: ""  # 在 .env 文件中设置 / Set in .env file
    model: "deepseek-chat"  # deepseek-chat, deepseek-coder
    base_url: "https://api.deepseek.com/v1"
    temperature: 0.2
    max_tokens: 8192
  
  # vLLM（OpenAI 兼容 API）/ vLLM (OpenAI-compatible API)
  vllm:
    api_key: "EMPTY"  # vLLM 通常不需要 API Key / vLLM usually does not require a real API key
    model: "gpt-oss-120b"  # 你部署的模型名称 example: gpt-oss-120b
    base_url: "http://172.24.128.111:30207/v1"  # vLLM 服务地址 example: http://172.24.128.111:30207/v1
    temperature: 0.2
    max_tokens: 8192

# 自适应知识抽取 / Adaptive knowledge extraction
knowledge_extraction:
  enabled: true
  # 通用字段固定，seed facets 只作为初始提示；系统会根据主题和论文自动生成最终 facets。
  # Generic fields are fixed; seed facets only guide topic-adaptive schema induction.
  seed_facets:
    - "method"
    - "scenario"
    - "mechanism"
    - "constraint"
    - "metric"
  allow_new_facets: true
  require_evidence: true
  max_papers: 20
  new_facet_min_support: 2

# Web 服务配置 / Web service settings
web:
  host: "0.0.0.0"
  port: 5000
  debug: true
  title: "中国能源具身智能研究情报"
  # Web 描述 / Web description
  description: "聚焦中国能源政策、能源智能体与源网荷储自主决策"

# 调度配置 / Scheduler settings
scheduler:
  # 是否启用自动调度 / Enable automatic scheduling
  enabled: true
  
  # 运行时间（24小时制，HH:MM 格式）/ Run time (24-hour format, HH:MM)
  run_time: "09:00"
  
  # 时区 / Timezone
  timezone: "Asia/Shanghai"
  
  # 启动时是否立即运行一次 / Run once on startup
  run_on_start: true
  
  # 邮件通知配置（可选）/ Email notification settings (optional)
  notification:
    enabled: false
    email:
      smtp_server: "smtp.gmail.com"
      smtp_port: 587
      sender: ""  # 发件人邮箱 / Sender email
      password: ""  # 在 .env 文件中设置 EMAIL_PASSWORD / Set EMAIL_PASSWORD in .env
      recipients:  # 收件人列表 / Recipient list
        - "your-email@example.com"
      on_success: true  # 成功时发送通知 / Notify on success
      on_failure: true  # 失败时发送通知 / Notify on failure

# 数据存储配置 / Data storage settings
storage:
  # 存储类型 / Storage type: json 或 sqlite
  type: "json"
  
  # JSON 存储路径 / JSON storage path
  json_path: "data/papers"

  # 统一文档 snapshot 存储路径 / Canonical document snapshots
  document_json_path: "data/documents"
  
  # SQLite 数据库路径 / SQLite database path
  sqlite_path: "data/arxiv.db"
  
  # 保留历史数据的天数（0 表示永久保留）/ Retention days (0 means keep forever)
  retention_days: 30

# 输出配置 / Output settings
outputs:
  markdown:
    enabled: true
    directory: "data/markdown"
  json:
    enabled: true
    directory: "data"
  obsidian:
    enabled: false
    vault_path: "data/obsidian"
    use_markdown_links: true
  zotero:
    enabled: false
    mode: "local_api"
    base_url: "http://localhost:23119/api"
    user_id: 0
    timeout_seconds: 5
    export_directory: "data/zotero"

# 分析配置 / Analysis settings
analysis:
  trend_window_days:
    - 7
    - 30
    - 60
  compare_sources: true
  entity_tracking: true
  cross_source:
    strong_threshold: 60
    resonance_threshold: 55
    weak_threshold: 40
    max_representatives: 3

reporting:
  enabled: true
  default_type: "weekly"
  directory: "data/reports"
  max_items_per_section: 6
  weekly_days: 7
  stage_days: 180

# 日志配置 / Logging settings
logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR, CRITICAL
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "logs/daily_arxiv.log"
  console: true
