name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyright

      - name: Check Python syntax
        run: python -m compileall -q main.py scheduler.py src test

      - name: Check browser JavaScript syntax
        run: node --check static/js/main.js

      - name: Run static type checks
        run: python -c "import subprocess, sys; raise SystemExit(subprocess.call([sys.executable, '-m', 'pyright', '--pythonpath', sys.executable]))"

      - name: Run regression suite
        run: python -m unittest discover -s test -p "test_*.py"

      - name: Smoke test Flask APIs
        run: python -m unittest test.test_web_narrative test.test_web_forecast test.test_web_reports test.test_web_directories
